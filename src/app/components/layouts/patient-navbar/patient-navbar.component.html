<!-- Patient Navbar - Fijo en todas las rutas del paciente -->
<nav class="navbar navbar-expand-lg patient-navbar mb-4 rounded-4 shadow-sm px-4">
  <div class="container-fluid">
    <span class="navbar-brand d-flex align-items-center gap-2">
      <i class="material-icons">medical_services</i>
      <span class="fw-bold">DentalTurnos</span>
    </span>
    <div class="navbar-nav ms-auto align-items-center">
      <span class="navbar-text me-3">
        Bienvenido, <span class="fw-semibold">{{ getUserGreeting() }}</span>
        <span [class]="getTipoClass(user?.tipoUsuario || '')" style="margin-left: 8px;">{{ user?.tipoUsuario }}</span>
      </span>
      <button class="btn btn-outline-light btn-sm ms-2" (click)="logout()">
        <i class="material-icons me-1">logout</i> Cerrar Sesión
      </button>
    </div>
  </div>
</nav>

<!-- Menú de navegación siempre visible -->
<div class="row mb-4">
  <div class="col-12">
    <div class="btn-group w-100 shadow-sm rounded-3 overflow-hidden" role="group">
      <button 
        type="button" 
        class="btn nav-btn-dashboard py-3"
        [class.active]="isActiveRoute('vistaPaciente')"
        (click)="navigateToDashboard()">
        <i class="material-icons me-1">dashboard</i> Mi Panel
      </button>
      <button 
        type="button" 
        class="btn nav-btn-reservar py-3"
        [class.active]="isActiveRoute('reservarTurno')"
        (click)="navigateToReservar()">
        <i class="material-icons me-1">add_circle</i> Reservar Turno
      </button>
      <button 
        type="button" 
        class="btn nav-btn-turnos py-3"
        [class.active]="isActiveRoute('misTurnos')"
        (click)="navigateToTurnos()">
        <i class="material-icons me-1">calendar_today</i> Mis Turnos
      </button>
    </div>
  </div>
</div>
