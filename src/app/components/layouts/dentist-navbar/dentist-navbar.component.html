<!-- Dentist Navbar - Fijo en todas las rutas del dentista -->
<nav class="navbar navbar-expand-lg dentist-navbar mb-4 rounded-4 shadow-sm px-4">
  <div class="container-fluid">
    <span class="navbar-brand d-flex align-items-center gap-2">
      <i class="material-icons">medical_services</i>
      <span class="fw-bold">DentalTurnos</span>
    </span>
    <div class="navbar-nav ms-auto align-items-center">
      <span class="navbar-text me-3">
        Bienvenido, <span class="fw-semibold">{{ getUserGreeting() }}</span>
        <span [class]="getTipoClass(user?.tipoUsuario || '')" style="margin-left: 8px;">{{ user?.tipoUsuario }}</span>
      </span>
      <span class="navbar-text ms-2 fw-bold text-primary" *ngIf="especialidadUsuario">{{ especialidadUsuario }}</span>
      <button class="btn btn-outline-light btn-sm ms-2" (click)="logout()">
        <i class="material-icons me-1">logout</i> Cerrar Sesión
      </button>
    </div>
  </div>
</nav>

<!-- Menú de navegación siempre visible -->
<div class="row mb-4">
  <div class="col-12">
    <div class="btn-group w-100 shadow-sm rounded-3 overflow-hidden" role="group">
      <button 
        type="button" 
        class="btn nav-btn-dashboard py-3"
        [class.active]="isActiveRoute('dashboard')"
        (click)="navigateToDashboard()">
        <i class="material-icons me-1">dashboard</i> Dashboard
      </button>
      <button 
        type="button" 
        class="btn nav-btn-pacientes py-3"
        [class.active]="isActiveRoute('pacientes')"
        (click)="navigateToPacientes()">
        <i class="material-icons me-1">people</i> Pacientes
      </button>
      <button 
        type="button" 
        class="btn nav-btn-agenda py-3"
        [class.active]="isActiveRoute('agenda')"
        (click)="navigateToAgenda()">
        <i class="material-icons me-1">calendar_today</i> Agenda
      </button>
      <button 
        type="button" 
        class="btn nav-btn-reservar py-3"
        [class.active]="isActiveRoute('reservarTurno')"
        (click)="navigateToReservar()">
        <i class="material-icons me-1">add_circle</i> Registrar Turno
      </button>
      <button 
        type="button" 
        class="btn nav-btn-configuracion py-3"
        *ngIf="user?.tipoUsuario !== 'secretario'"
        [class.active]="isActiveRoute('configuracion-disponibilidad')"
        (click)="navigateToConfiguracion()">
        <i class="material-icons me-1">schedule</i> Configuración
      </button>
      <button 
        type="button" 
        class="btn nav-btn-tratamientos py-3"
        *ngIf="user?.tipoUsuario !== 'secretario'"
        [class.active]="isActiveRoute('tratamiento')"
        (click)="navigateToTratamientos()">
        <i class="material-icons me-1">medical_services</i> Tratamientos
      </button>
    </div>
  </div>
</div>
