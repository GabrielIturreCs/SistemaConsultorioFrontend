<div class="login-container">
  <!-- Left Side: Brand -->
  <div class="login-brand-side">
    <div class="brand-pattern"></div>
    <div class="brand-content">
      <div class="brand-logo">
        <i class="fas fa-tooth"></i>
      </div>
      <h1 class="brand-title">DentalTurnos</h1>
      <p class="brand-subtitle">
        Gestión odontológica de vanguardia.<br>
        Eficiencia, seguridad y tecnología al servicio de su clínica.
      </p>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="login-form-side">
    <button class="back-btn" (click)="navigateToHome()" title="Volver al inicio">
      <i class="bi bi-arrow-left"></i>
    </button>

    <div class="form-header">
      <h2 class="form-title">Bienvenido</h2>
      <p class="form-subtitle">Ingrese sus credenciales para acceder al sistema</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input 
            type="text" 
            class="form-control" 
            [(ngModel)]="loginForm.nombreUsuario" 
            name="nombreUsuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input 
            type="password" 
            class="form-control" 
            [(ngModel)]="loginForm.password" 
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required>
        </div>
      </div>

      <div *ngIf="msglogin" class="alert alert-danger mb-4">
        {{ msglogin }}
      </div>

      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="!canLogin || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="divider">
      <span>o continúe con</span>
    </div>

    <div class="google-btn-container">
      <div id="google-btn-wrapper"></div>
    </div>

    <div class="register-link">
      ¿No tiene una cuenta? 
      <a href="javascript:void(0)" (click)="navigateToRegister()">Regístrese aquí</a>
    </div>
  </div>
</div>
