<div *ngIf="cargandoOdontograma" class="odontograma-loading">
  <div style="text-align:center; padding: 40px; font-size: 1.3rem; color: #2563eb;">
    <i class="fas fa-spinner fa-spin"></i> Cargando odontograma...
  </div>
</div>
<div *ngIf="!cargandoOdontograma" class="odontograma-container">
  <!-- Barra de herramientas -->
  <div class="toolbar">
    <div class="toolbar-section">
      <h3>Herramientas</h3>
      <div class="herramientas-grid">
        <button 
          *ngFor="let herramienta of herramientas"
          class="herramienta-btn"
          [class.active]="herramientaActual === herramienta.id"
          (click)="seleccionarHerramienta(herramienta.id)"
          [title]="herramienta.nombre">
          <i [class]="herramienta.icono"></i>
          <span>{{ herramienta.nombre }}</span>
        </button>
      </div>
    </div>

    <div class="toolbar-section">
      <h3>Estados</h3>
      <div class="estados-grid">
        <button 
          *ngFor="let estado of coloresEstado | keyvalue"
          class="estado-btn"
          [class.active]="estadoActual === estado.key"
          [style.background-color]="estado.value"
          (click)="seleccionarEstado(keyToString(estado.key))">
          {{ keyToString(estado.key) | titlecase }}
        </button>
      </div>
    </div>

  </div>

  <!-- Odontograma principal -->
  <div class="odontograma-main odontograma-fdi">
    <div class="odontograma-fdi-label-row">
      <span class="label-derecha-abs">DERECHA</span>
      <span class="label-izquierda-abs">IZQUIERDA</span>
    </div>
    <!-- Fila superior: Cuadrante 2 | Separador | Cuadrante 1 (invertido) -->
    <div class="odontograma-fdi-row">
      <div class="odontograma-fdi-celda cuadrante-num">1</div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(2)">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="separador-central"></div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(1).slice().reverse()">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="odontograma-fdi-celda cuadrante-num">2</div>
    </div>
    <!-- Numeración superior (derecha 1-8, izquierda 8-1) -->
    <div class="odontograma-fdi-header">
      <div class="odontograma-fdi-celda"></div>
      <ng-container *ngFor="let n of [8,7,6,5,4,3,2,1]">
        <div class="odontograma-fdi-celda">{{ n }}</div>
      </ng-container>
      <div class="separador-central"></div>
      <ng-container *ngFor="let n of [1,2,3,4,5,6,7,8]">
        <div class="odontograma-fdi-celda">{{ n }}</div>
      </ng-container>
      <div class="odontograma-fdi-celda"></div>
    </div>
    <!-- Fila inferior: Cuadrante 3 | Separador | Cuadrante 4 (invertido) -->
    <div class="odontograma-fdi-row">
      <div class="odontograma-fdi-celda cuadrante-num">4</div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(3)">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="separador-central"></div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(4).slice().reverse()">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="odontograma-fdi-celda cuadrante-num">3</div>
    </div>
    <!-- Temporales: Cuadrante 6 y 5 (superior, 5 invertido) -->
    <div class="odontograma-fdi-row">
      <div class="odontograma-fdi-celda cuadrante-num">5</div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(6)">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="separador-central"></div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(5).slice().reverse()">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="odontograma-fdi-celda cuadrante-num">6</div>
    </div>
    <!-- Numeración temporales superior (derecha 5-1, izquierda 1-5) -->
    <div class="odontograma-fdi-header">
      <div class="odontograma-fdi-celda"></div>
      <ng-container *ngFor="let n of [5,4,3,2,1]">
        <div class="odontograma-fdi-celda">{{ n }}</div>
      </ng-container>
      <div class="separador-central"></div>
      <ng-container *ngFor="let n of [1,2,3,4,5]">
        <div class="odontograma-fdi-celda">{{ n }}</div>
      </ng-container>
      <div class="odontograma-fdi-celda"></div>
    </div>
    <!-- Temporales: Cuadrante 7 y 8 (inferior, 7 invertido) -->
    <div class="odontograma-fdi-row">
      <div class="odontograma-fdi-celda cuadrante-num">8</div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(7).slice().reverse()">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="separador-central"></div>
      <div class="odontograma-fdi-celda" *ngFor="let pieza of getPiezasPorCuadrante(8)">
        <app-pieza-dental [pieza]="pieza" (zonaClic)="onZonaClic($event)"></app-pieza-dental>
      </div>
      <div class="odontograma-fdi-celda cuadrante-num">7</div>
    </div>
  </div>

  <!-- Panel de información -->
  <div class="info-panel">
    <div class="info-section">
      <label for="odontologo">Odontólogo:</label>
      <div id="odontologo" style="color: #111; font-weight: bold; font-size: 1rem;">
        {{ odontologoLogueado }}
      </div>
    </div>

    <div class="info-section">
      <label for="notas">Notas clínicas:</label>
      <textarea 
        id="notas"
        rows="4"
        [value]="odontogramaData.notas"
        (input)="onNotasChange($event)"
        placeholder="Escriba las observaciones clínicas..."
        style="color: #111; font-weight: 500;">
      </textarea>
    </div>

    <div class="info-section">
      <div class="fecha-info">
        <strong>Fecha:</strong> {{ odontogramaData.fecha | date:'dd/MM/yyyy HH:mm' }}
      </div>
    </div>
  </div>

  <!-- Leyenda -->
  <div class="leyenda">
    <h3>Leyenda de Estados</h3>
    <div class="leyenda-items">
      <div *ngFor="let estado of coloresEstado | keyvalue" class="leyenda-item">
        <div class="color-box" [style.background-color]="estado.value"></div>
        <span>{{ keyToString(estado.key) | titlecase }}</span>
      </div>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="acciones">
    <button class="btn btn-primary" (click)="guardarOdontograma()" [disabled]="guardando || exportando">
      <i class="fas fa-save"></i>
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
    
    <button class="btn btn-secondary" (click)="imprimirGrafico()" [disabled]="exportando">
      <i class="fas fa-print"></i>
      Imprimir Gráfico
    </button>
    
    <button class="btn btn-secondary" (click)="imprimirDatos()" [disabled]="exportando">
      <i class="fas fa-list"></i>
      Imprimir Datos
    </button>
    
    <button class="btn btn-warning" (click)="limpiarOdontograma()">
      <i class="fas fa-trash"></i>
      Limpiar
    </button>
    
    <button class="btn btn-info" (click)="exportarImagen()" [disabled]="exportando">
      <i class="fas fa-image"></i>
      Exportar Imagen
    </button>
  </div>
</div>
<div *ngIf="exportando" class="odontograma-exportando-overlay">
  <div class="odontograma-exportando-spinner">
    <i class="fas fa-spinner fa-spin"></i> Procesando PDF...
  </div>
</div>
